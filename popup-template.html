<div class="cloud-save-popup popup">

        <span style="font-weight:600; text-transform: uppercase;">Cloud Save</span>
        <button class="close-btn">X</button>
    </div>

    <p>
        <strong>File:</strong> 
        <span id='filename'>Download</span>
    </p>

    <p>
        <strong>Destination:</strong>
        <span id='cloud-provider'>Google Drive</span>
    </p>

    <button class="save-btn">
        Download to Drive
    </button>
</div>
