---
- name: Deploy App to AWS EC2
  hosts: fastapi_servers
  become: true # Runs commands as root user using sudo
  vars:
    aws_region: "us-east-1"
    ecr_registry: ""
    image_name: "fastapi-app"
    image_tag: "dev"
    extension_id: ""
    docker_host: "0.0.0.0"
    instance_port: 8000
    env: "dev"
    # Used by aws_ssm connection
    ansible_connection: aws_ssm
    ansible_aws_ssm_bucket_name: "" 
    ansible_aws_ssm_region: "us-east-1"
  
  tasks:
    - name: Ensure Docker is installed
      ansible.builtin.dnf:
        name:
          - docker
        state: present
        update_cache: true 
    
    - name: Ensure Docker service is started and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Sign into AWS ECR 
      ansible.builtin.shell: |
        aws ecr get-login-password --region {{aws_region}} | docker login --username AWS --password-stdin {{ecr_registry}}
      changed_when: true 
    
    - name: Pull latest image from ECR 
      ansible.builtin.command: "docker pull {{ecr_registry}}/{{image_name}}:{{image_tag}}"
      changed_when: true 

    - name: Check if there's a container running
      ansible.builtin.command: "docker ps -a -q --filter name=cloud-save-server"
      register: existing_container
      changed_when: false 

    - name: Stop and remove old container
      ansible.builtin.shell: |
        docker stop cloud-save-server || true
        docker rm cloud-save-server || true 
      when: existing_container.stdout != ""
      changed_when: true

    - name: Launch updated app
      ansible.builtin.shell: >
        docker run -d -p {{instance_port}}:8000 
        -e HOST="{{docker_host}}" 
        -e EXTENSION_ID="{{extension_id}}" 
        -e STAGE="{{env}}"
        --name cloud-save-server
        --restart unless-stopped
        {{ecr_registry}}/{{image_name}}:{{image_tag}}